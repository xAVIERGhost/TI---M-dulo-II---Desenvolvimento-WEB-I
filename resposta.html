<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resposta</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width:500px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        thead,tfoot {
            background-color: grey;
            color: white;
        }
        thead > tr > th {
            position: sticky;
            top: 0;
            background-color: gray;            
        }
        td.num {
            text-align: right;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }
        tbody > tr:nth-child(2n) {
            background-color: gray;
        } 
        
    </style>
</head>
<body>
    <h1>Tabelas grandes</h1>
    <table>
        <caption>
            População Dos estados Brasileiros-2024
        </caption>
        <thead>
            <tr>
                <th 
                scope="col">Estado</th>
                <th scope="col"
                style="width: 100px">População 
                </th>
                <th 
                scope="col">Comando Html Utilizado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.973.190</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.322.692</td>
            </tr>
            <tr> 
                <td>Rio de Janeiro</td>
                <td class="num">14.850.513</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11.824.665</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">11.229.915</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th
                scope="row">Total de Habitantes</th>
                <td class="num"> <strong>122.420.654</strong></td>
            </tr>
        </tfoot>
    </table>
    
    
</body>
</html>
